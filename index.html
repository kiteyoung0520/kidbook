;bottom:4px;font-size:11px;background:#111b31c9;padding:2px 5px;border-radius:5px}.dialog{display:flex;gap:16px;align-items:flex-start;background:#131d33;border:1px solid #ffffff26;padding:15px;border-radius:16px}.dialog .speech{flex:1;min-width:0}.dialog .name{font-weight:800;color:var(--gold);margin-bottom:5px}.choices{display:grid;gap:9px;margin-top:13px}.choice{width:100%;text-align:left;background:#394a68;border:1px solid #ffffff38;color:white;padding:13px;border-radius:13px;line-height:1.55}.choice:hover{background:#536789}.choice small{display:block;color:#d3d9e6;margin-top:4px}.chip{font-size:12px;background:#142035;border:1px solid #ffffff30;padding:4px 9px;border-radius:20px}.bar{height:7px;background:#151d31;border-radius:9px;overflow:hidden;margin:5px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,#9ad6d2,#e6c68e)}h1,h2,h3{line-height:1.35}h1{font-size:clamp(26px,5vw,40px)}h2{font-size:22px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}.storyText{white-space:pre-line}.note{border-left:3px solid var(--gold);padding:8px 13px;background:#182338;border-radius:0 10px 10px 0}.divider{border-top:1px solid var(--line);margin:14px 0}input{width:100%;padding:12px;background:#151e33;color:white;border:1px solid #ffffff55;border-radius:10px}.tabbar{display:flex;gap:7px;overflow:auto;padding:3px 0 12px}.tabbar .btn{white-space:nowrap}.log{max-height:280px;overflow:auto}.log p{border-bottom:1px solid var(--line);padding-bottom:8px}.ending{font-size:22px;color:var(--gold);font-weight:900}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f2d497;color:#272b38;padding:10px 20px;border-radius:12px;z-index:10;box-shadow:0 10px 25px #0006}.intro{max-width:720px;margin:auto}.hidden{display:none!important}@media(max-width:650px){main{padding:11px}.card{padding:14px}.stats{grid-template-columns:repeat(3,1fr)}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.portrait{width:79px;height:109px}.portrait .hair{left:10px}.portrait .face{left:19px}.portrait .eyes{left:28px}.dialog{gap:10px;padding:10px}.scene{min-height:195px}header{padding:9px 12px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .25s ease}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}}</style></head><body><div id="app"></div><script>
'use strict';const KEY='kongmen_v3_save';const roles={zilu:{name:'子路',title:'勇直之士',hair:'#292c3d',robe:'#657b9b',stats:{仁:13,義:20,禮:8,智:10,信:13,勇:22},desc:'率直而熱心，遇事總想先行動。你的挑戰是讓勇氣與智慧同行。'},zigong:{name:'子貢',title:'善辯之士',hair:'#3b303e',robe:'#6f769c',stats:{仁:12,義:11,禮:16,智:22,信:13,勇:10},desc:'機敏善辯，擅長觀察利益與人心。你的挑戰是讓才智不只服務自己。'},yanhui:{name:'顏回',title:'好學之士',hair:'#383449',robe:'#799b93',stats:{仁:22,義:14,禮:14,智:17,信:15,勇:8},desc:'謙遜好學，懂得安住於簡樸生活。你的挑戰是把內在修養轉成外在行動。'}};
const npc={孔子:{hair:'#47414b',robe:'#9c8773'},子路:{hair:'#292c3d',robe:'#657b9b'},子貢:{hair:'#3b303e',robe:'#6f769c'},顏回:{hair:'#383449',robe:'#799b93'},曾子:{hair:'#2d3d45',robe:'#728a85'},冉有:{hair:'#353747',robe:'#7c829c'},旁白:{hair:'#37465d',robe:'#667a99'},商販:{hair:'#4b3a35',robe:'#927b64'},老人:{hair:'#c6b5a2',robe:'#6d8792'}};
const story={
 market:{title:'市集的誤會',place:'曲阜市集',scene:'market',source:'遊戲虛構情境；呼應《論語》「見義不為，無勇也」',start:'m0',nodes:{m0:{who:'子路',text:'前面吵起來了！那商販竟對老人如此無禮，我去替他討個公道！',choices:[['先擋下子路，分開雙方並逐一詢問','m1',{智:2},{子路:-1},'先確認事實，子路可能覺得你不信任他。'],['陪子路上前制止商販，先把老人護到一旁','m2',{勇:2},{子路:2},'立即介入保護弱者；若判斷錯誤，衝突可能升高。'],['先扶老人離開爭執，確認是否受傷及藥包來源','m3',{仁:2,禮:1},{顏回:1},'先照顧當事人情緒，釐清責任會慢一些。']]},m1:{who:'商販',text:'不是我要欺負他！老人把我攤上的藥包拿走了，可我也沒問清楚……',choices:[['核對藥包標記與地上收據，再請雙方各自說明','m4',{智:2},null,'用可查證的線索還原經過，避免先入為主。'],['先讓雙方冷靜，約定核對清楚後再談責任','m5',{禮:1},null,'先止住衝突，但誤會可能暫時沒有解開。']]},m2:{who:'商販',text:'你們憑什麼認定是我欺負人？這藥包是老人自己拿走的！子路的手停在半空。',choices:[['承認剛才判斷太快，請老人與商販分別重述經過','m4',{義:2,智:1},{子路:1},'願意修正自己的判斷，也讓各方有完整陳述的機會。'],['要求商販先為言語失當道歉，再處理藥包歸屬','m5',{勇:1},{子路:-2},'先追究態度可能暫時出一口氣，卻未釐清誰拿錯藥。']]},m3:{who:'老人',text:'我以為那是我已付過錢的藥……我眼睛不好，或許弄錯了。',choices:[['陪老人回想購買過程，逐項核對帳目與藥包','m4',{仁:1,智:1},null,'照顧長者尊嚴，也用事實確認是否真的付過錢。'],['請商販先提供急需藥品，費用與責任稍後再核對','m5',{仁:1},null,'優先處理眼前需要，但可能讓責任與公平問題延後。']]},m4:{who:'旁白',text:'你發現兩包藥的布繩顏色相似，老人確實拿錯。商販也承認自己急躁。子路低聲說：「原來勇敢還要先看清楚。」',end:true,flag:'market_truth',reward:{義:2,信:1},bond:{子路:2},summary:'你查明了誤會，雙方和解。',quote:'《論語·為政》：「知之為知之，不知為不知，是知也。」'},m5:{who:'旁白',text:'雙方暫時散去，但誤會沒有完全釐清。數日後，商販可能再次找上門來。',end:true,flag:'market_unresolved',reward:{禮:1},bond:{子路:-1},summary:'你暫時平息爭端，卻留下未解的疑問。',quote:'反思：化解情緒與釐清事實，是否是同一件事？'}}},
 promise:{title:'失約的同窗',place:'杏壇書舍',scene:'night',source:'遊戲虛構情境；呼應《論語·學而》「與朋友交而不信乎」',start:'p0',nodes:{p0:{who:'曾子',text:'你昨日答應替我整理竹簡，子貢卻邀你去看城外的奇貨。你如何安排？',choices:[['向子貢說明已答應曾子，先完成竹簡整理再赴約','p1',{信:3},{曾子:2,子貢:-1},'守住承諾，代價是錯過眼前的奇貨邀約。'],['和子貢商量分工：你整理、他核對，完成後再一起赴約','p2',{智:2,禮:1},{子貢:1,曾子:1},'兼顧兩段關係，但需要先協調分工並承擔合作風險。'],['先赴子貢的邀約，沒有告知曾子，打算回來再補做','p3',{智:1},{曾子:-2,子貢:2},'眼前機會優先，失約會直接消耗曾子的信任。']]},p1:{who:'曾子',text:'你留下來整理竹簡，卻發現一卷記錄似乎被人移動過。曾子神色凝重。',choices:[['記下竹簡位置、經手時間與在場者，暫不指名指責','p4',{智:1,義:1},'保留線索並避免冤枉人，調查速度會較慢。'],['立即召集同門保全現場，公開竹簡失蹤一事','p5',{勇:1},null,'快速讓大家協尋，也可能在證據不足時引發猜疑。']]},p2:{who:'子貢',text:'子貢笑道：「我還以為你要拒絕我呢。」他一邊幫忙，一邊發現竹簡數目不對。',choices:[['與子貢逐卷清點，將缺失位置和時間記錄下來','p4',{智:2},{子貢:1},'用共同查核建立線索，需要花時間逐卷確認。'],['先把發現如實告訴曾子，請他決定是否通知其他人','p5',{信:1},{曾子:1},'尊重承諾對象的知情權，但暫時由他承受決策壓力。']]},p3:{who:'曾子',text:'等你回來，書舍已經鎖門。曾子只留下紙條：「我等了很久。」隔天，一卷竹簡不見了。',choices:[['坦承失約，提出補做整理的時間，並留下來一起追查','p4',{信:2},{曾子:1},'承認責任並提出補救，不能立刻消除對方失望。'],['解釋奇貨邀約也很重要，要求曾子體諒你的安排','p5',{勇:1},{曾子:-1},'替自己說明理由，但若沒有事前溝通，信任仍會受損。']]},p4:{who:'旁白',text:'你留下了詳細紀錄。雨夜裡，一個細微線索將成為解開竹簡之謎的關鍵。',end:true,flag:'promise_care',reward:{信:1},bond:{曾子:1},summary:'你留下線索，也重新思考守信的意義。',quote:'《論語·學而》：「吾日三省吾身……與朋友交而不信乎？」'},p5:{who:'旁白',text:'事情暫時告一段落，但同門開始猜測竹簡究竟去了哪裡。曾子看著你，似乎還有話沒說。',end:true,flag:'promise_rumor',reward:{勇:1},bond:{曾子:-1},summary:'傳聞開始擴散，信任受到考驗。',quote:'《論語·顏淵》：「民無信不立。」'}}},
 rain:{title:'雨夜失簡',place:'書舍 · 雨夜',scene:'rain',source:'遊戲原創懸疑故事，融入儒家「不妄斷」與反省觀點',start:'r0',nodes:{r0:{who:'顏回',text:'那卷重要的竹簡不見了。有人看見子路傍晚走過書舍，大家都懷疑他……',choices:[['私下請子路按時間順序說明昨晚行蹤，先不下結論','r1',{仁:2},{子路:2},'保留他的尊嚴與發言權，但仍需後續證據佐證。'],['封存窗邊水漬與竹架位置，先檢查是否有移動痕跡','r2',{智:2},{曾子:1},'從現場找證據，可能暫時無法安撫被懷疑的人。'],['向孔子報告失物與目前線索，請他協助制止無根據的指責','r3',{禮:2,信:1},{顏回:1},'先穩住秩序和言論，但調查需要多人配合。']]},r1:{who:'子路',text:'我來過，但只是把窗關上！你也不信我嗎？他憤怒之餘，仍把濕透的衣袖攤給你看。',choices:[['告訴子路願意與他並肩查找，沿他關窗的路線一起查看','r4',{信:2},{子路:2},'先修復信任並合作找線索，仍要讓證據說話。'],['請子路回想關窗前後的時間、位置與最後見到竹簡的人','r5',{智:1},{子路:1},'聚焦時間線而非猜測；問法不慎仍可能像在盤問。']]},r2:{who:'旁白',text:'你在窗邊發現水漬與鬆動的竹架。昨晚的大雨似乎比任何人都更可疑。',choices:[['先拍下竹架原狀，再小心移動並檢查後方縫隙','r4',{智:2},null,'保留現場後再找物證，避免移動時破壞痕跡。'],['請曾子回憶竹簡最後一次清點的位置與經手順序','r5',{信:1},{曾子:1},'補齊保管紀錄，也可能發現管理流程本身有疏漏。']]},r3:{who:'孔子',text:'「聽聞不等於親見。若要明辨，還需察其本末。」你獲准與同門共同查找。',choices:[['沿雨水流入方向追查，檢視布簾、窗框與竹架後方','r4',{智:2},null,'用環境線索驗證可能性，過程較慢但能避免誤指他人。'],['請每位在場者各自寫下最後見到竹簡的時間，再比對差異','r5',{禮:1,智:1},null,'讓每個人都有發言機會，也能降低彼此互相影響記憶。']]},r4:{who:'旁白',text:'竹簡原來滑進竹架後方，被雨水沖落的布簾蓋住。子路沉默片刻，說：「你們肯查清楚，比替我說好話還重要。」',end:true,flag:'rain_truth',reward:{義:3,智:2},bond:{子路:2,曾子:1},summary:'你找到竹簡，澄清了對子路的誤會。',quote:'故事改編反思：在證據不足時，如何避免以印象判斷他人？'},r5:{who:'旁白',text:'眾人拼湊出線索，最後在竹架後找回竹簡。雖然真相大白，子路仍對最初的懷疑耿耿於懷。',end:true,flag:'rain_found',reward:{智:2,禮:1},bond:{子路:-1},summary:'你找回竹簡，但仍有關係需要修復。',quote:'《論語·衛靈公》：「躬自厚而薄責於人。」'}}},
 grain:{title:'糧倉三難',place:'魯國 · 糧倉',scene:'grain',source:'遊戲改編自《論語·顏淵》「子貢問政」，非歷史事件重現',start:'g0',nodes:{g0:{who:'子貢',text:'官府的糧食不夠，邊境也有警報。若只能優先處理一件事，你會先顧什麼？',choices:[['先為最急迫的飢餓者發放限量口糧，並登記受助名冊','g1',{仁:3},{顏回:1},'先減輕眼前危機，但必須面對存糧可能不足以持續的風險。'],['暫停大規模發糧，快速抽查庫存與帳冊後訂出配給標準','g2',{智:3},{子貢:2},'提高分配準確度，但等待期間仍有人挨餓。'],['先公告目前能確定的存糧與承諾，不隱瞞短缺但說明待查項目','g3',{信:3,義:1},{曾子:1},'維持資訊透明，公開不確定性可能引起短期恐慌。']]},g1:{who:'子貢',text:'你先開倉賑濟，百姓暫時安心。但倉吏提醒：糧食有限，明日怎麼辦？',choices:[['公布存糧和每日配額，邀地方代表共同監督分配','g4',{信:2,智:1},null,'提高公平與信任，但協商會增加執行時間。'],['不等完整清帳，先擴大救急發放，之後再補做核帳','g5',{仁:2},null,'救急速度快，帳務與後續公平性風險會升高。']]},g2:{who:'冉有',text:'你發現帳冊有重複記錄。若先整頓，或許能多出幾日糧食，但眼前有人正在挨餓。',choices:[['分兩組同步清帳與緊急發糧，每批發放都當場登記','g4',{仁:2,智:1},null,'兼顧速度和查核，但需要足夠人手與可靠分工。'],['先完成全數清點和重複帳目核實，再決定發放數量','g5',{智:1},null,'降低帳目錯誤，代價是延後眼前救濟。']]},g3:{who:'子貢',text:'你要求官府如實公告存糧，民眾開始理解難處。但誠實揭露也引來恐慌。',choices:[['召集百姓代表討論優先順序，公開紀錄不同意見與決議','g4',{禮:2,信:1},null,'讓受影響者參與決策，但難以快速取得一致。'],['由官府先公布臨時配給方案，承諾定期公開檢討並接受申訴','g5',{勇:1},null,'先確保行動速度，但必須承擔決策錯誤與後續問責。']]},g4:{who:'旁白',text:'官府公布存糧與分配辦法，百姓願意協助運糧。危機尚未完全解除，但信任讓大家有了合作的基礎。',end:true,flag:'grain_trust',reward:{信:3,仁:1},bond:{子貢:2,冉有:1},summary:'你建立透明分配機制，讓合作成為可能。',quote:'《論語·顏淵》：「自古皆有死，民無信不立。」'},g5:{who:'旁白',text:'你的方案暫時奏效，卻有一部分百姓感到不安。子貢提醒你：決策不只要看當下，也要看人心是否能承受。',end:true,flag:'grain_fragile',reward:{勇:1},bond:{子貢:1},summary:'你渡過眼前危機，留下長期信任課題。',quote:'《論語·顏淵》：子貢問政，孔子以足食、足兵、民信論治。'}}}
};
const fresh=()=>({version:3,role:null,nick:'',day:1,stats:null,bonds:{孔子:0,子路:0,子貢:0,顏回:0,曾子:0,冉有:0},done:[],flags:{},journal:[],screen:'create',current:null,node:null,ending:null,study:0,bondTalked:[]});let s;try{const old=JSON.parse(localStorage.getItem(KEY));s=old&&old.version===3&&old.role&&roles[old.role]?old:fresh()}catch(e){s=fresh()}if(!Array.isArray(s.bondTalked))s.bondTalked=[];let draftRole='zilu',draftNick='';const el=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){toast('瀏覽器無法存檔，請匯出備份')}};const toast=t=>{document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2300)};const portrait=(name)=>{const x=npc[name]||npc.旁白;return `<div class="portrait" style="--hair:${x.hair};--robe:${x.robe}"><div class="hair"></div><div class="face"></div><div class="eyes">• •</div><div class="body"></div><span class="badge">${esc(name)}</span></div>`};const button=(label,fn,cls='')=>`<button class="btn ${cls}" data-act="${fn}">${label}</button>`;const header=()=>`<header><strong>✦ 孔門養成記 V3</strong><div class="flex"><span class="tiny muted">${s.role?`${esc(s.nick||roles[s.role].name)} · 第 ${s.day} 日`:'風雨杏壇'}</span>${s.role?button('主畫面','home','ghost'):''}</div></header>`;const scene=(title,place,type='')=>`<div class="scene ${type}"><span class="place">${esc(place)}</span><div class="sceneTitle">${esc(title)}</div></div>`;const statHtml=()=>`<div class="stats">${Object.entries(s.stats).map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;const relationship=()=>Object.entries(s.bonds).map(([k,v])=>`<div style="margin:8px 0"><div class="flex between"><span>${k}</span><span class="tiny muted">${v>0?'+':''}${v}｜${v>=5?'深厚信任':v>=2?'漸有默契':v<=-2?'有所隔閡':'初識'}</span></div><div class="bar"><span style="width:${Math.max(4,Math.min(100,50+v*7))}%"></span></div></div>`).join('');const storyReady=id=>!s.done.includes(id)&&(id==='market'||id==='promise'||(id==='rain'&&s.done.includes('promise'))||(id==='grain'&&s.done.includes('rain')));const status=id=>s.done.includes(id)?'已完成':storyReady(id)?'可進行':'尚未解鎖';const gain=(stats={},bonds={})=>{for(const [k,v] of Object.entries(stats))s.stats[k]=Math.max(0,Math.min(100,(s.stats[k]||0)+v));for(const [k,v] of Object.entries(bonds))s.bonds[k]=Math.max(-10,Math.min(10,(s.bonds[k]||0)+v))};const choicesFor=n=>{const a=(n?.choices||[]).slice();if(s.current==='rain'&&s.node==='r0'){if(s.flags.market_truth)a.push(['運用市集查帳的經驗，先從現場痕跡查起','r2',{智:1},{顏回:1},'你曾用查證化解誤會，這次可以把方法用在現場。']);if(s.flags.promise_care)a.push(['想起曾子留下的紀錄，先逐一核對線索','r3',{信:1,智:1},{曾子:1},'前章留下的紀錄讓你能先整理時間線，再召集同門。'])}return a};const storyLine=n=>{if(s.current==='rain'&&s.node==='r0'){if(s.flags.promise_rumor)return '竹簡不見了。先前的傳聞已讓同門彼此猜疑，顏回提醒你：「這次若再憑印象指責，恐怕更難挽回信任。」';if(s.flags.market_unresolved)return '竹簡不見了。市集那場未查清的誤會仍讓人不安，顏回問你：「這次要先安撫眾人，還是先找證據？」';if(s.flags.market_truth)return '竹簡不見了。顏回想起你曾在市集查清誤會：「你擅長從細節找答案，這次也願意先看證據嗎？」'}return n.text};function render(){let h=header()+'<main>';if(s.screen==='create')h+=`<div class="intro">${scene('杏壇初遇','魯國 · 曲阜')}<div class="card"><h1>你想成為哪位孔門弟子？</h1><p class="muted">扮演真實孔門人物，進入經典啟發的架空故事。人物性格參考文獻，具體對話為遊戲創作。</p><div class="grid three">${Object.entries(roles).map(([id,r])=>`<button class="btn" data-act="pick" data-id="${id}" style="border-color:${draftRole===id?'#f5d18b':'#ffffff33'}">${portrait(r.name)}<b>${r.name}</b><div class="tiny muted">${r.title}</div></button>`).join('')}</div><div class="divider"></div><h3>${roles[draftRole].name} · ${roles[draftRole].title}</h3><p>${roles[draftRole].desc}</p><label class="tiny muted" for="nick">遊戲稱呼（可留空，預設使用弟子本名）</label><input id="nick" maxlength="12" placeholder="輸入稱呼" value="${esc(draftNick)}"><div style="margin-top:14px">${button('踏入杏壇，開始故事','start','primary')}</div></div></div>`;
else if(s.screen==='home')h+=`${scene('杏壇風雲','魯國 · 曲阜')}<div class="card"><div class="flex between"><div><h2>${esc(s.nick)} · ${roles[s.role].title}</h2><span class="muted">第 ${s.day} 日｜已完成 ${s.done.length}/4 幕主線</span></div><span class="chip">自由探索 · 無體力限制</span></div>${statHtml()}</div><div class="grid"><section class="card"><h2>劇情篇章</h2>${Object.entries(story).map(([id,e],i)=>`<div class="flex between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${i+1}. ${e.title}</b><div class="tiny muted">${status(id)}</div></div><button class="btn" data-act="launch" data-id="${id}" ${storyReady(id)?'':'disabled'}>進入</button></div>`).join('')}<p class="tiny muted">雨夜失簡須完成「失約的同窗」；糧倉三難須完成「雨夜失簡」。</p></section><section class="card"><h2>自由活動</h2><div class="grid">${[['study','📜 修學','智＋1'],['reflect','🌿 自省','仁＋1'],['talk','💬 拜訪同門','人物互動'],['journal','📖 修身錄','故事紀錄'],['bond','🤝 羈絆','人物關係'],['settings','⚙️ 存檔','備份管理']].map(([id,label,desc])=>`<button class="btn" data-act="${id}"><b>${label}</b><div class="tiny muted">${desc}</div></button>`).join('')}</div><div style="margin-top:13px">${button('🌙 迎接新的一天','next','gold')}</div></section></div>${s.done.length===4?`<div class="card"><h2>最終章已解鎖</h2><p>你的抉擇將形成一段屬於自己的孔門人生。</p>${button('觀看人生評語與結局','ending','primary')}</div>`:''}`;
else if(s.screen==='story'){const e=story[s.current],n=e.nodes[s.node];h+=`${scene(e.title,e.place,e.scene)}<div class="card"><div class="flex between"><span class="chip">${e.title}</span><span class="tiny muted">${e.source}</span></div><div class="divider"></div><div class="dialog">${portrait(n.who)}<div class="speech"><div class="name">${n.who}</div><div class="storyText">${esc(storyLine(n))}</div></div></div>${n.end?`<div class="note" style="margin-top:14px"><b>${n.summary}</b><p class="tiny">${n.quote}</p></div><div style="margin-top:12px">${button('記錄這段經歷，返回杏壇','finish','gold')}</div>`:`<div class="choices">${choicesFor(n).map((c,i)=>`<button class="choice" data-act="choose" data-id="${i}">${i+1}. ${esc(c[0])}<small>${esc(c[4]||'這個選擇會影響能力與人物關係。')}</small></button>`).join('')}</div>`}</div>`}
else if(s.screen==='talk'){const people=['孔子','子路','子貢','顏回','曾子','冉有'];h+=`<div class="card"><h2>拜訪同門</h2><p class="muted">同一個故事，因為彼此的信任與經歷不同，人物也可能有不同回應。</p><div class="grid three">${people.map(p=>`<button class="btn" data-act="speak" data-id="${p}">${portrait(p)}<b>${p}</b><div class="tiny muted">關係 ${s.bonds[p]}</div></button>`).join('')}</div></div>`}
else if(s.screen==='speech'){const p=s.talking,shared=s.bondTalked.includes(s.done.length+':'+p);let line={孔子:'學而不思則罔，思而不學則殆。你今日想從何處用功？',子路:s.flags.rain_truth?'那夜你沒有輕信傳言，我記得。以後有事，咱們一起面對！':s.flags.market_truth?'市集那天，我學到不能只憑一時血氣。':'做人要有膽識！但夫子總提醒我，勇也須合乎義。',子貢:s.flags.grain_trust?'那次糧倉之事，我看見信任竟能使眾人合作。': '你說，才智應用來追求眼前利益，還是長久的信任？',顏回:'一簞食，一瓢飲。若心有所安，簡單的日子也能有滋味。',曾子:s.flags.promise_rumor?'流言容易傳開，修復信任卻需要時間。': '吾日三省吾身。今天你最想反省哪一件事？',冉有:'理想很重要，但事情要落實，總得把人力、時間與資源算清楚。'}[p];h+=`<div class="card"><h2>與 ${p} 對談</h2><div class="dialog">${portrait(p)}<div class="speech"><div class="name">${p}</div>${line}</div></div><div class="choices">${shared?`<button class="btn primary" disabled>本章經歷已分享過</button>`:`<button class="btn primary" data-act="befriend">分享本章經歷（羈絆＋1）</button>`}${shared?'<p class="tiny muted">真正的信任來自共同經歷；完成新的篇章後，再回來與同門交流。</p>':''}${button('返回人物列表','talk','ghost')}</div></div>`}
else if(s.screen==='bond')h+=`<div class="card"><h2>人物羈絆</h2>${relationship()}${button('返回杏壇','home')}</div>`;
else if(s.screen==='journal')h+=`<div class="card"><h2>修身錄</h2><p class="muted">選擇不只影響數值，也留下人生的痕跡。</p><div class="log">${s.journal.length?s.journal.map(x=>`<p>${esc(x)}</p>`).join(''):'尚無紀錄。先去探索一段故事吧。'}</div>${button('返回杏壇','home')}</div>`;
else if(s.screen==='settings')h+=`<div class="card"><h2>存檔管理</h2><p>遊戲會自動儲存在目前瀏覽器。若更換裝置、清除瀏覽器資料或使用無痕模式，紀錄可能消失。建議匯出備份。</p><div class="flex">${button('下載 JSON 備份','export','gold')}<label class="btn">匯入 JSON 備份<input id="import" type="file" accept="application/json,.json" style="display:none"></label>${button('重新開始','reset','ghost')}</div><p class="tiny muted">匯入會覆蓋目前進度；V2 存檔不直接相容，請保留原版備份。</p>${button('返回杏壇','home')}</div>`;
else if(s.screen==='ending'){let rank=Object.entries(s.stats).sort((a,b)=>b[1]-a[1])[0][0],titles={仁:'仁心同行者',義:'守義實踐者',禮:'和而不同者',智:'明辨求真者',信:'言而有信者',勇:'勇而能思者'};let bonus=s.flags.rain_truth&&s.flags.grain_trust?'你既願意查明事實，也願意建立信任。':s.flags.rain_found?'你找到答案，也明白關係修復不能只靠真相。':'你走過不同的抉擇，發現每種選擇都有代價。';h+=`${scene('夫子評語','杏壇 · 晨光')}<div class="card"><div class="ending">${titles[rank]}</div><p>孔子看著你的修身錄，緩緩說道：</p><div class="dialog">${portrait('孔子')}<div class="speech"><div class="name">孔子 · 遊戲虛構評語</div>你在這段日子裡，最常展現的是「${rank}」。${bonus}學問不止於知，更在於行。往後你將如何待人處事，仍由你自己決定。</div></div><p class="muted tiny">這是根據遊戲選擇產生的敘事回饋，並非孔子的真實語錄，也不是人格評量。</p>${statHtml()}<div class="flex" style="margin-top:15px">${button('繼續自由探索','home','primary')}${button('查看修身錄','journal')}</div></div>`}
h+='</main>';el.innerHTML=h;const inp=document.getElementById('nick');if(inp)inp.addEventListener('input',e=>draftNick=e.target.value);document.getElementById('import')?.addEventListener('change',importFile)}
function go(screen){s.screen=screen;save();render();window.scrollTo(0,0)}function addLog(t){s.journal.unshift(`第 ${s.day} 日｜${t}`);s.journal=s.journal.slice(0,100)}function choose(i){const n=story[s.current].nodes[s.node];if(!n||!n.choices)return;const c=choicesFor(n)[i];if(!c)return;gain(c[2],c[3]);addLog(`${story[s.current].title}：${c[0]}`);s.node=c[1];save();render()}function finish(){const n=story[s.current].nodes[s.node];if(!n?.end)return;gain(n.reward,n.bond);s.flags[n.flag]=true;s.done.push(s.current);addLog(`${story[s.current].title}完成：${n.summary}`);s.current=null;s.node=null;go('home');toast('故事完成，已自動存檔')}function importFile(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(x.version!==3||!roles[x.role]||!x.stats||!x.bonds||!Array.isArray(x.done)||!Array.isArray(x.journal))throw Error();if(!confirm('確定用備份覆蓋目前進度？'))return;s=x;save();render();toast('存檔匯入成功')}catch(err){alert('存檔格式無效，請使用 V3 匯出的 JSON 備份。')}};reader.readAsText(file)}function exportFile(){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='孔門養成記_V3_存檔.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;switch(act){case'pick':draftRole=id;render();break;case'start':s=fresh();s.role=draftRole;s.nick=(draftNick||roles[draftRole].name).trim().slice(0,12)||roles[draftRole].name;s.stats={...roles[draftRole].stats};addLog(`以${roles[draftRole].name}的身分踏入杏壇`);go('home');break;case'home':go('home');break;case'launch':if(!storyReady(id))return;s.current=id;s.node=story[id].start;go('story');break;case'choose':choose(Number(id));break;case'finish':finish();break;case'next':s.day++;addLog('迎接新的一天');go('home');toast('新的一天開始了');break;case'study':s.stats.智=Math.min(100,s.stats.智+1);s.study++;addLog('聽講讀書，智＋1');save();render();toast('智＋1');break;case'reflect':s.stats.仁=Math.min(100,s.stats.仁+1);addLog('靜坐反省，仁＋1');save();render();toast('仁＋1');break;case'talk':go('talk');break;case'speak':s.talking=id;go('speech');break;case'befriend':if(!s.bondTalked.includes(s.done.length+':'+s.talking)){s.bondTalked.push(s.done.length+':'+s.talking);s.bonds[s.talking]=Math.min(10,s.bonds[s.talking]+1);addLog(`與${s.talking}分享經歷，羈絆增加`);save();render();toast('羈絆＋1')}break;case'bond':case'journal':case'settings':go(act);break;case'ending':go('ending');break;case'export':exportFile();break;case'reset':if(confirm('確定清除 V3 進度，重新開始？此動作無法復原。')){s=fresh();draftNick='';save();render()}break;}});render();
</script></body></html>
