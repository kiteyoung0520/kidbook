const story={
 market:{title:'市集的誤會',place:'曲阜市集',scene:'market',source:'遊戲虛構情境；呼應《論語》「見義不為，無勇也」',start:'m0',nodes:{m0:{who:'子路',text:'前面吵起來了！那商販竟對老人如此無禮，我去替他討個公道！',choices:[['先攔住子路，問清楚緣由','m1',{智:2}, {子路:-1}],['跟子路一起上前主持公道','m2',{勇:2},{子路:2}],['先安撫老人，請雙方冷靜','m3',{仁:2,禮:1},{顏回:1}]]},m1:{who:'商販',text:'不是我要欺負他！老人把我攤上的藥包拿走了，可我也沒問清楚……',choices:[['查看藥包與地上的收據','m4',{智:2}],['勸商販先道歉','m5',{禮:1}]]},m2:{who:'商販',text:'你們憑什麼認定是我欺負人？這藥包是老人自己拿走的！子路的手停在半空。',choices:[['承認判斷太快，重新詢問','m4',{義:2,智:1},{子路:1}],['堅持商販必須先道歉','m5',{勇:1},{子路:-2}]]},m3:{who:'老人',text:'我以為那是我已付過錢的藥……我眼睛不好，或許弄錯了。',choices:[['陪老人核對帳目','m4',{仁:1,智:1}],['請商販免費送藥','m5',{仁:1}]]},m4:{who:'旁白',text:'你發現兩包藥的布繩顏色相似，老人確實拿錯。商販也承認自己急躁。子路低聲說：「原來勇敢還要先看清楚。」',end:true,flag:'market_truth',reward:{義:2,信:1},bond:{子路:2},summary:'你查明了誤會，雙方和解。',quote:'《論語·為政》：「知之為知之，不知為不知，是知也。」'},m5:{who:'旁白',text:'雙方暫時散去，但誤會沒有完全釐清。數日後，商販可能再次找上門來。',end:true,flag:'market_unresolved',reward:{禮:1},bond:{子路:-1},summary:'你暫時平息爭端，卻留下未解的疑問。',quote:'反思：化解情緒與釐清事實，是否是同一件事？'}}},
 promise:{title:'失約的同窗',place:'杏壇書舍',scene:'night',source:'遊戲虛構情境；呼應《論語·學而》「與朋友交而不信乎」',start:'p0',nodes:{p0:{who:'曾子',text:'你昨日答應替我整理竹簡，子貢卻邀你去看城外的奇貨。你如何安排？',choices:[['履行承諾，婉拒邀請','p1',{信:3},{曾子:2,子貢:-1}],['請子貢一起來幫忙','p2',{智:2,禮:1},{子貢:1,曾子:1}],['先去看奇貨，稍後再說','p3',{智:1},{曾子:-2,子貢:2}]]},p1:{who:'曾子',text:'你留下來整理竹簡，卻發現一卷記錄似乎被人移動過。曾子神色凝重。',choices:[['先記下異常，暫不指責任何人','p4',{智:1,義:1}],['立刻通知其他同門','p5',{勇:1}]]},p2:{who:'子貢',text:'子貢笑道：「我還以為你要拒絕我呢。」他一邊幫忙，一邊發現竹簡數目不對。',choices:[['與子貢仔細核對','p4',{智:2},{子貢:1}],['先向曾子報告','p5',{信:1},{曾子:1}]]},p3:{who:'曾子',text:'等你回來，書舍已經鎖門。曾子只留下紙條：「我等了很久。」隔天，一卷竹簡不見了。',choices:[['向曾子坦承失約並協助追查','p4',{信:2},{曾子:1}],['辯稱自己也有重要事情','p5',{勇:1},{曾子:-1}]]},p4:{who:'旁白',text:'你留下了詳細紀錄。雨夜裡，一個細微線索將成為解開竹簡之謎的關鍵。',end:true,flag:'promise_care',reward:{信:1},bond:{曾子:1},summary:'你留下線索，也重新思考守信的意義。',quote:'《論語·學而》：「吾日三省吾身……與朋友交而不信乎？」'},p5:{who:'旁白',text:'事情暫時告一段落，但同門開始猜測竹簡究竟去了哪裡。曾子看著你，似乎還有話沒說。',end:true,flag:'promise_rumor',reward:{勇:1},bond:{曾子:-1},summary:'傳聞開始擴散，信任受到考驗。',quote:'《論語·顏淵》：「民無信不立。」'}}},
 rain:{title:'雨夜失簡',place:'書舍 · 雨夜',scene:'rain',source:'遊戲原創懸疑故事，融入儒家「不妄斷」與反省觀點',start:'r0',nodes:{r0:{who:'顏回',text:'那卷重要的竹簡不見了。有人看見子路傍晚走過書舍，大家都懷疑他……',choices:[['先詢問子路，給他解釋機會','r1',{仁:2},{子路:2}],['檢查書舍留下的痕跡','r2',{智:2},{曾子:1}],['先向孔子報告，不讓流言擴散','r3',{禮:2,信:1},{顏回:1}]]},r1:{who:'子路',text:'我來過，但只是把窗關上！你也不信我嗎？他憤怒之餘，仍把濕透的衣袖攤給你看。',choices:[['相信他，和他一起查找','r4',{信:2},{子路:2}],['請他回想誰最後碰過竹簡','r5',{智:1},{子路:1}]]},r2:{who:'旁白',text:'你在窗邊發現水漬與鬆動的竹架。昨晚的大雨似乎比任何人都更可疑。',choices:[['移開竹架檢查','r4',{智:2}],['先找曾子核對竹簡位置','r5',{信:1},{曾子:1}]]},r3:{who:'孔子',text:'「聽聞不等於親見。若要明辨，還需察其本末。」你獲准與同門共同查找。',choices:[['先查看雨水浸入之處','r4',{智:2}],['召集大家回憶最後一次見到竹簡','r5',{禮:1,智:1}]]},r4:{who:'旁白',text:'竹簡原來滑進竹架後方，被雨水沖落的布簾蓋住。子路沉默片刻，說：「你們肯查清楚，比替我說好話還重要。」',end:true,flag:'rain_truth',reward:{義:3,智:2},bond:{子路:2,曾子:1},summary:'你找到竹簡，澄清了對子路的誤會。',quote:'故事改編反思：在證據不足時，如何避免以印象判斷他人？'},r5:{who:'旁白',text:'眾人拼湊出線索，最後在竹架後找回竹簡。雖然真相大白，子路仍對最初的懷疑耿耿於懷。',end:true,flag:'rain_found',reward:{智:2,禮:1},bond:{子路:-1},summary:'你找回竹簡，但仍有關係需要修復。',quote:'《論語·衛靈公》：「躬自厚而薄責於人。」'}}},
 grain:{title:'糧倉三難',place:'魯國 · 糧倉',scene:'grain',source:'遊戲改編自《論語·顏淵》「子貢問政」，非歷史事件重現',start:'g0',nodes:{g0:{who:'子貢',text:'官府的糧食不夠，邊境也有警報。若只能優先處理一件事，你會先顧什麼？',choices:[['優先安置飢餓的百姓','g1',{仁:3},{顏回:1}],['先查明庫存、制定分配方案','g2',{智:3},{子貢:2}],['先維護官府的公開承諾','g3',{信:3,義:1},{曾子:1}]]},g1:{who:'子貢',text:'你先開倉賑濟，百姓暫時安心。但倉吏提醒：糧食有限，明日怎麼辦？',choices:[['公開數量並邀請地方共同分配','g4',{信:2,智:1}],['先救眼前的人，再想辦法','g5',{仁:2}]]},g2:{who:'冉有',text:'你發現帳冊有重複記錄。若先整頓，或許能多出幾日糧食，但眼前有人正在挨餓。',choices:[['同步清帳與緊急發糧','g4',{仁:2,智:1}],['等查清楚再發放','g5',{智:1}]]},g3:{who:'子貢',text:'你要求官府如實公告存糧，民眾開始理解難處。但誠實揭露也引來恐慌。',choices:[['召集百姓商議分配原則','g4',{禮:2,信:1}],['由官府自行決定，避免爭論','g5',{勇:1}]]},g4:{who:'旁白',text:'官府公布存糧與分配辦法，百姓願意協助運糧。危機尚未完全解除，但信任讓大家有了合作的基礎。',end:true,flag:'grain_trust',reward:{信:3,仁:1},bond:{子貢:2,冉有:1},summary:'你建立透明分配機制，讓合作成為可能。',quote:'《論語·顏淵》：「自古皆有死，民無信不立。」'},g5:{who:'旁白',text:'你的方案暫時奏效，卻有一部分百姓感到不安。子貢提醒你：決策不只要看當下，也要看人心是否能承受。',end:true,flag:'grain_fragile',reward:{勇:1},bond:{子貢:1},summary:'你渡過眼前危機，留下長期信任課題。',quote:'《論語·顏淵》：子貢問政，孔子以足食、足兵、民信論治。'}}}
};

const extraStory={
 chen_cai:{title:'陳蔡絕糧・雨夜抉擇',place:'陳蔡之間 · 暴雨夜',scene:'rain',source:'歷史典故改編；人物對話與分支為遊戲創作',kind:'travel',summary:'困頓之中，決定守住什麼。',start:'c0',nodes:{c0:{who:'顏回',text:'糧車遲遲未到，眾人已經兩日未曾飽食。外頭傳來急促腳步：有人提議趁夜離開，也有人主張守住承諾，等候援助。你怎麼做？',choices:[['先盤點餘糧與傷病，訂出今晚分配','c1',{智:2,仁:1},{顏回:1}],['召集同門商量，讓每個人說出擔心','c2',{禮:2,信:1},{子貢:1}],['陪最疲憊的人先休息，天亮再議','c3',{仁:2},{子路:1}]]},c1:{who:'冉有',text:'盤點後發現，若分配得宜，大家還能撐到天明。可有人質疑：最有力氣的人是否該多分一些？',choices:[['公開原則，按需要而非聲量分配','c4',{義:2,信:1}],['讓大家投票決定','c5',{禮:1,智:1}]]},c2:{who:'子貢',text:'討論讓焦慮浮上檯面。子路說要開路，顏回則提醒：慌亂時更要顧及彼此。',choices:[['先確保安全，再尋找可行援助','c4',{勇:1,智:1}],['尊重各人選擇，安排同行與留下的人','c5',{禮:2,仁:1}]]},c3:{who:'孔子',text:'夫子看著疲憊的弟子說：「志士仁人，無求生以害仁。」但眼前仍需具體安排。',choices:[['照顧弱者並一起分配食物','c4',{仁:2,義:1}],['請大家各自安靜片刻再作決定','c5',{禮:1,智:1}]]},c4:{who:'旁白',text:'你們以透明方式分配所剩食物，也安排輪值照看傷病。夜仍漫長，但眾人知道彼此沒有被遺忘。',end:true,flag:'chen_shared',reward:{仁:2,信:2},bond:{顏回:1,子路:1},summary:'你讓共同承擔取代彼此猜疑。',quote:'《論語·衛靈公》：「志士仁人，無求生以害仁。」'},c5:{who:'旁白',text:'眾人各自作出選擇，最後仍找到暫時可行的安排。你明白，決策程序也需要照顧少數人的處境。',end:true,flag:'chen_choice',reward:{禮:2,智:1},bond:{子貢:1},summary:'你尊重不同意見，也看見協商的責任。',quote:'故事改編反思：困境中如何兼顧公平、效率與照顧？'}}},
 road:{title:'子路問津・兩條路',place:'古道渡口',scene:'market',source:'《論語·微子》典故延伸；支線為遊戲創作',kind:'travel',summary:'尋路之前，先弄清自己要去哪裡。',start:'r0',nodes:{r0:{who:'子路',text:'渡口老人指向兩條路：一條近但泥濘，另一條遠卻平穩。同行者意見不一，天色也漸暗。你會如何判斷？',choices:[['詢問路況與同行者狀態，再估算時間','r1',{智:2,禮:1},{冉有:1}],['選近路，大家互相照應','r2',{勇:2,仁:1},{子路:1}],['先聽老人完整說明，不急著選','r3',{禮:2,智:1},{顏回:1}]]},r1:{who:'老人',text:'老人補充：泥路曾有人迷失，但也有人熟悉近道。遠路則需經過一處可能封閉的橋。',choices:[['派人查橋，同時準備近路備案','r4',{智:2,信:1}],['請熟悉地形的人帶隊走近路','r5',{勇:1,禮:1}]]},r2:{who:'子路',text:'你帶隊走近路，雨勢卻突然變大。子路不慌，卻提醒你：勇氣不能代替路標。',choices:[['停下確認方向、清點隊伍','r4',{智:1,信:1}],['沿著溪流快速前進','r5',{勇:2}]]},r3:{who:'老人',text:'老人笑了：「你們問的是哪一條路，卻沒先說要到哪裡。」此話讓大家安靜下來。',choices:[['先對齊目的地與每個人的底線','r4',{禮:2,仁:1}],['由最有經驗的人決定','r5',{信:1,勇:1}]]},r4:{who:'旁白',text:'你們確認目的地、體力與路況後選擇了可調整的路線。行程較慢，卻沒有人被落下。',end:true,flag:'road_reflect',reward:{智:2,禮:1},bond:{子路:1,冉有:1},summary:'你以明辨帶領同行，而非只追求最快。',quote:'《論語·微子》：「子路問津於長沮、桀溺。」'},r5:{who:'旁白',text:'隊伍抵達時已很疲憊。子路承認：「我只盯著方向，忘了先看大家能不能走到。」',end:true,flag:'road_rush',reward:{勇:1,仁:1},bond:{子路:1},summary:'你抵達目的地，也學會檢視決策的代價。',quote:'故事改編反思：速度、風險與照顧，如何取得平衡？'}}},
 redemption:{title:'子貢贖人・義與利',place:'魯國市街',scene:'grain',source:'《呂氏春秋》相關典故改編；不是《論語》篇章',kind:'travel',summary:'好事如何持續，取決於制度是否公平。',start:'b0',nodes:{b0:{who:'子貢',text:'你在外地遇見被俘的魯國人，出資贖回後依規定可向官府請款。子貢問：若不領取，是否更顯高尚？',choices:[['先確認制度目的與後續救援資源','b1',{智:2,義:1},{子貢:1}],['公開領回款項，避免只靠個人承擔','b2',{信:2,禮:1},{曾子:1}],['先救人，暫不討論名聲與款項','b3',{仁:2,勇:1},{顏回:1}]]},b1:{who:'曾子',text:'曾子提醒：若每次都要求個人自掏腰包，長久下來可能讓更多人不敢救援。',choices:[['領回款項並公開帳目，建立常態流程','b4',{信:2,智:1}],['自願放棄，但說明這是個人選擇','b5',{義:2,仁:1}]]},b2:{who:'子貢',text:'子貢擔心領款會被人誤解為追求利益。你如何回應？',choices:[['把救援成果與款項用途一併公開','b4',{信:2,禮:1}],['先聽受救者與家屬的想法','b5',{仁:2,禮:1}]]},b3:{who:'旁白',text:'人已救回，但還有更多同樣遭遇的人需要協助。單次善意能否變成穩定支持？',choices:[['邀集眾人共同設立救援基金','b4',{義:1,信:2}],['先陪伴受救者返回家鄉','b5',{仁:2}]]},b4:{who:'旁白',text:'你們建立公開帳目與共同救援流程，善意不再只能依賴個人犧牲。有人仍有疑慮，但可以透過透明資訊討論。',end:true,flag:'redeem_system',reward:{信:2,智:2},bond:{子貢:2},summary:'你讓善行有了可持續的制度支撐。',quote:'歷史典故改編反思：個人高尚與公共制度如何互補？'},b5:{who:'旁白',text:'你照顧了眼前的人，也坦誠說明自己的選擇。眾人受到感動，卻開始思考：下一次誰來承擔？',end:true,flag:'redeem_personal',reward:{仁:2,義:1},bond:{顏回:1,子貢:1},summary:'你完成眼前援助，也看見善意需要接續。',quote:'故事改編反思：善行如何避免成為不可持續的個人負擔？'}}},
 humility:{title:'顏回陋巷・一簞食',place:'陋巷 · 薄暮',scene:'night',source:'《論語·雍也》意涵改編；情節為遊戲創作',kind:'travel',summary:'安於簡樸，不等於忽略困難。',start:'h0',nodes:{h0:{who:'顏回',text:'你到顏回住處探望，見屋舍簡陋、食物不多。顏回仍在讀書。你想幫忙，卻不確定他是否願意接受。',choices:[['先詢問他真正需要什麼','h1',{禮:1,仁:2},{顏回:1}],['直接送上生活物資','h2',{仁:2,勇:1}],['邀請同門一起整理環境與資源','h3',{智:1,信:1},{曾子:1}]]},h1:{who:'顏回',text:'顏回說：「清靜讀書是我所樂，但若有餘力，也希望能幫助鄰里的孩子。」',choices:[['一起安排讀書時段與分享課','h4',{仁:2,智:1}],['先協助改善最急迫的生活問題','h5',{義:1,仁:1}]]},h2:{who:'顏回',text:'顏回感謝你，但提醒：有些安排看似幫助，未必符合對方的需要。',choices:[['道謝提醒，改為先聽他的想法','h4',{禮:1,信:1}],['留下物資，再邀他自行決定','h5',{仁:1,義:1}]]},h3:{who:'曾子',text:'同門提出互助方案，也有人擔心長期資源不足。你會如何讓計畫不只停留在熱心？',choices:[['訂出輪值與公開資源清單','h4',{信:2,智:1}],['先從一場小型共學開始','h5',{勇:1,禮:1}]]},h4:{who:'旁白',text:'你們把顏回的意願放在中心，安排共學與互助。生活未因此一夕改變，卻多了一份共同承擔。',end:true,flag:'humility_colearn',reward:{仁:2,信:1},bond:{顏回:2},summary:'你把尊重化為彼此都能參與的行動。',quote:'《論語·雍也》：「一簞食，一瓢飲，在陋巷，人不堪其憂，回也不改其樂。」'},h5:{who:'旁白',text:'你們先處理眼前需要，也留下後續聯絡方式。顏回說，心安與生活支持並不衝突。',end:true,flag:'humility_support',reward:{仁:2,義:1},bond:{顏回:1},summary:'你看見精神安定與實際支持可以並行。',quote:'故事改編反思：理解他人的快樂，不代表忽略他的需要。'}}},

else if(s.screen==='speech'){const p=s.talking;let line={孔子:'學而不思則罔，思而不學則殆。你今日想從何處用功？',子路:s.flags.rain_truth?'那夜你沒有輕信傳言，我記得。以後有事，咱們一起面對！':s.flags.market_truth?'市集那天，我學到不能只憑一時血氣。':'做人要有膽識！但夫子總提醒我，勇也須合乎義。',子貢:s.flags.grain_trust?'那次糧倉之事，我看見信任竟能使眾人合作。': '你說，才智應用來追求眼前利益，還是長久的信任？',顏回:'一簞食，一瓢飲。若心有所安，簡單的日子也能有滋味。',曾子:s.flags.promise_rumor?'流言容易傳開，修復信任卻需要時間。': '吾日三省吾身。今天你最想反省哪一件事？',冉有:'理想很重要，但事情要落實，總得把人力、時間與資源算清楚。'}[p];h+=`<div class="card"><h2>與 ${p} 對談</h2><div class="dialog">${portrait(p)}<div class="speech"><div class="name">${p}</div>${line}</div></div><div class="choices">${button('分享最近的經歷（信任＋1）','befriend','primary')}${button('返回人物列表','talk','ghost')}</div></div>`}

function go(screen){s.screen=screen;save();render();window.scrollTo(0,0)}function addLog(t){s.journal.unshift(`第 ${s.day} 日｜${t}`);s.journal=s.journal.slice(0,100)}function choose(i){const n=story[s.current].nodes[s.node];if(!n||!n.choices)return;const c=n.choices[i];if(!c)return;gain(c[2],c[3]);addLog(`${story[s.current].title}：${c[0]}`);s.node=c[1];save();render()}function finish(){const n=story[s.current].nodes[s.node];if(!n?.end)return;gain(n.reward,n.bond);s.flags[n.flag]=true;s.done.push(s.current);addLog(`${story[s.current].title}完成：${n.summary}`);s.current=null;s.node=null;go('home');toast('故事完成，已自動存檔')}function importFile(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(x.version!==3||!roles[x.role]||!x.stats||!x.bonds||!Array.isArray(x.done)||!Array.isArray(x.journal))throw Error();if(!confirm('確定用備份覆蓋目前進度？'))return;s=x;save();render();toast('存檔匯入成功')}catch(err){alert('存檔格式無效，請使用 V3 匯出的 JSON 備份。')}};reader.readAsText(file)}function exportFile(){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='孔門養成記_V3_存檔.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;switch(act){case'pick':draftRole=id;render();break;case'start':s=fresh();s.role=draftRole;s.nick=(draftNick||roles[draftRole].name).trim().slice(0,12)||roles[draftRole].name;s.stats={...roles[draftRole].stats};addLog(`以${roles[draftRole].name}的身分踏入杏壇`);go('home');break;case'home':go('home');break;case'launch':if(!storyReady(id))return;s.current=id;s.node=story[id].start;go('story');break;case'choose':choose(Number(id));break;case'finish':finish();break;case'next':s.day++;addLog('迎接新的一天');go('home');toast('新的一天開始了');break;case'study':s.stats.智=Math.min(100,s.stats.智+1);s.study++;addLog('聽講讀書，智＋1');save();render();toast('智＋1');break;case'reflect':s.stats.仁=Math.min(100,s.stats.仁+1);addLog('靜坐反省，仁＋1');save();render();toast('仁＋1');break;case'talk':go('talk');break;case'speak':s.talking=id;go('speech');break;case'befriend':s.bonds[s.talking]=Math.min(10,s.bonds[s.talking]+1);addLog(`與${s.talking}談心，信任增加`);go('speech');toast('羈絆＋1');break;case'bond':case'journal':case'settings':go(act);break;case'ending':go('ending');break;case'export':exportFile();break;case'reset':if(confirm('確定清除 V4 進度，重新開始？此動作無法復原。')){s=fresh();draftNick='';save();render()}break;}});render();
