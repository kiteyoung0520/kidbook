 debate:makeArc({title:'辯論之後',place:'杏壇 · 論辯席',scene:'market',summary:'有理不等於要贏，理解也是一種能力。',art:4,openWho:'子貢',open:s=>`糧倉事件後，同門為「公平應否一視同仁」爭論不休。${s.flags.grain_trust?'你曾以公開分配建立信任。':'上次的資源分配仍留下不同看法。'}有人提高音量，討論逐漸變成互相指責。你會怎麼加入？`,first:[{label:'先重述雙方在意的事，確認彼此聽懂',stats:{禮:2,仁:1},skills:{傾聽:2,觀照:1}},{label:'提出判準與證據，釐清爭點',stats:{智:2,義:1},skills:{明理:2}},{label:'先暫停辯論，邀請大家各自整理立場',stats:{勇:1,禮:1},skills:{克制:1,觀照:1}}],branches:[{who:'子路',text:s=>`${s.flags.rain_truth?'你曾和同門一起查證雨夜失簡。':'幾位同門仍記得雨夜的猜疑。'}子路說：「我不怕不同意見，只怕大家只想把對方說輸。」`,choices:[{label:'邀雙方找出共同目標，再整理可檢驗的主張',stats:{義:1,智:1},skills:{明理:1,傾聽:1}},{label:'說明自己的判斷，也承認目前證據的限制',stats:{信:2},skills:{觀照:1,明理:1}}]},{who:'顏回',text:'顏回指出，有人一直沒有發言。他並非沒有想法，只是每次開口都被打斷。',choices:[{label:'把發言順序交給較少發言的人',stats:{仁:2,禮:1},skills:{傾聽:2}},{label:'請大家各用一句話說明最在意的風險',stats:{智:1,禮:1},skills:{明理:1,傾聽:1}}]},{who:'孔子',text:'夫子提醒：「君子和而不同。」現在要決定，是繼續追問，還是先停下來照顧關係。',choices:[{label:'指出人身攻擊已越界，請大家回到議題',stats:{義:2,勇:1},skills:{克制:1,躬行:1}},{label:'先承認自己也有急著說服人的時候',stats:{信:1,仁:1},skills:{觀照:1,躬行:1}}]}],ends:[{flag:'debate_common',text:'眾人整理出共同目標與待查證問題。沒有人完全改變立場，但辯論重新回到可以合作的軌道。',summary:'你把爭勝轉成共同求證。',quote:'《論語·子路》：「君子和而不同，小人同而不和。」',reward:{禮:1,智:1},skills:{傾聽:1,明理:1}},{flag:'debate_humble',text:'你坦承自己也曾急著證明正確，氣氛慢慢鬆動。有人願意補上先前沒說完的理由。',summary:'承認自己的急切，為理解留出空間。',quote:'自我檢視：我是在尋找真相，還是在尋找勝利？',reward:{信:1,仁:1},skills:{觀照:1,躬行:1}},{flag:'debate_voice',text:'較少發言的同門說出實際受影響者的處境，討論因此補上重要資訊。',summary:'你讓被忽略的聲音進入討論。',quote:'《論語·衛靈公》：「君子求諸己，小人求諸人。」',reward:{仁:2},skills:{傾聽:2}},{flag:'debate_question',text:'大家把爭論拆成幾個可查證的問題，約定帶著資料再談。',summary:'你以問題取代貼標籤。',quote:'反思：哪些事實能讓我們修正立場？',reward:{智:2},skills:{明理:2}},{flag:'debate_boundary',text:'你指出談話越界並設定討論界線。有人不悅，但幾位同門願意回到議題。',summary:'你用界線保護討論品質。',quote:'《論語·顏淵》：「克己復禮為仁。」',reward:{義:2},skills:{克制:1,躬行:1}},{flag:'debate_repair',text:'你先道出自己的急切，子路也收回一句重話。辯論沒有立刻結束，關係有了修復的起點。',summary:'你先從自己的言行開始修正。',quote:'《論語·學而》：「過則勿憚改。」',reward:{信:1,仁:1},skills:{觀照:1,躬行:1}}]}),
 empty_seat:makeArc({title:'同窗的空席',place:'杏壇 · 共學席間',scene:'market',summary:'看見缺席者，練習邀請而不替人決定。',art:5,openWho:'顏回',open:s=>`共學時總有一張空席。${s.flags.debate_voice?'昨天你讓較少發言的人說完想法。':'最近的辯論讓幾位同門愈來愈沉默。'}一名新來的學子站在門外，像是想加入又怕打擾。你會怎麼做？`,first:[{label:'走到門口介紹大家，詢問他是否想一起旁聽',stats:{仁:2,禮:1},skills:{傾聽:1,躬行:1}},{label:'請熟識的同門陪他熟悉共學規則',stats:{禮:2},skills:{傾聽:1,求助:1}},{label:'先留一個座位，讓他自己決定何時加入',stats:{信:1,仁:1},skills:{觀照:1}}],branches:[{who:'新學子',text:'他說自己曾在討論中被笑過，因此不確定這裡是否安全。',choices:[{label:'問他希望如何被介紹，尊重他的步調',stats:{禮:2,仁:1},skills:{傾聽:2}},{label:'坦白說明共學規則，也邀他只聽不發言',stats:{信:1,禮:1},skills:{觀照:1,躬行:1}}]},{who:'子貢',text:'有人擔心新學子加入會拖慢進度。子貢問：如何兼顧共學品質與新人的參與？',choices:[{label:'設計輪流提問與同伴協助',stats:{智:1,禮:2},skills:{明理:1,傾聽:1}},{label:'先試行一回合，會後徵詢所有人感受',stats:{智:1,信:1},skills:{觀照:1,明理:1}}]},{who:'曾子',text:'曾子發現有人只是把空席留著，卻沒有真正改變排斥人的互動方式。',choices:[{label:'回看自己曾否打斷或忽略別人',stats:{信:1,仁:1},skills:{觀照:1,躬行:1}},{label:'請同門一起訂出可執行的共學約定',stats:{義:1,禮:1},skills:{躬行:1,傾聽:1}}]}],ends:[{flag:'empty_invited',text:'新學子選擇坐下旁聽，沒有被要求立刻表現。你們約定每次共學都保留一段新手也能參與的時間。',summary:'你以尊重步調的方式打開參與入口。',quote:'《論語·雍也》：「己欲立而立人，己欲達而達人。」',reward:{仁:2},bond:{顏回:1},skills:{傾聽:1,躬行:1}},{flag:'empty_buddy',text:'同伴陪他認識共學流程，他逐漸放下戒心。大家也開始輪流照顧新加入者。',summary:'你讓接納成為同伴一起承擔的事。',quote:'《論語·顏淵》：「四海之內，皆兄弟也。」',reward:{禮:2},bond:{子貢:1},skills:{求助:1,傾聽:1}},{flag:'empty_space',text:'新學子先坐在旁邊聽完一場，離開時留下問題。你沒有替他決定何時加入，卻讓他知道席位一直在。',summary:'你保留選擇空間，也持續發出邀請。',quote:'反思：邀請與催促，差別在哪裡？',reward:{信:1,仁:1},skills:{觀照:1}},{flag:'empty_rule',text:'共學小組試行輪流發言與同伴協助，幾位原本安靜的人也開始加入。',summary:'你把友善轉成共學規則。',quote:'《論語·衛靈公》：「君子成人之美。」',reward:{禮:1,智:1},skills:{明理:1,傾聽:1}},{flag:'empty_reflect',text:'你們盤點過去的互動方式，找到幾個無意間讓人退縮的習慣，並約定逐一修正。',summary:'你從檢視自身開始改善群體氛圍。',quote:'《論語·學而》：「見賢思齊焉，見不賢而內自省也。」',reward:{信:1,仁:1},skills:{觀照:1,躬行:1}},{flag:'empty_agreement',text:'同窗一起寫下共學約定，並指定每次輪值的引導者。空席慢慢變成可以安心加入的位置。',summary:'你讓接納有了可持續的做法。',quote:'反思：一個團體要如何讓新成員留下？',reward:{義:1,禮:1},skills:{躬行:1,傾聽:1}}]}),
 jade:makeArc({title:'借來的玉佩',place:'市集 · 玉器攤前',scene:'market',summary:'利益出現時，讓原則與透明度一起接受考驗。',art:6,openWho:'子貢',open:s=>`同窗借你的玉佩在市集展示，攤主提出高價收購，並暗示可以不必告訴玉佩主人。${s.flags.empty_invited?'新加入的學子也在場，正看著你怎麼處理。':'幾名同門等著看你如何回應。'}`,first:[{label:'當場說明玉佩是借來的，拒絕私下交易',stats:{信:2,義:1},skills:{躬行:2}},{label:'先詢問玉佩主人授權範圍與真實價值',stats:{智:2,禮:1},skills:{明理:1,觀照:1}},{label:'請子貢陪同處理，留下公開紀錄',stats:{禮:1,信:1},skills:{求助:1,躬行:1}}],branches:[{who:'攤主',text:'攤主說只要你答應，便能分你一筆酬謝；若拒絕，他會改找別人。',choices:[{label:'清楚拒絕並通知玉佩主人',stats:{信:2,勇:1},skills:{躬行:1,克制:1}},{label:'要求把所有條件寫清楚，再共同決定',stats:{智:1,信:1},skills:{明理:1,傾聽:1}}]},{who:'子貢',text:'子貢提醒，利益衝突不只看自己有沒有拿錢，也要看決策是否透明。',choices:[{label:'主動揭露關係，請無利害關係者協助評估',stats:{禮:1,信:2},skills:{明理:1,求助:1}},{label:'先確認主人意願與玉佩來源',stats:{智:2,義:1},skills:{明理:2}}]},{who:'曾子',text:'曾子問：若你相信自己沒有做錯，是否仍需要讓相關的人知道？',choices:[{label:'公開整個過程，讓主人自行選擇',stats:{信:2,仁:1},skills:{躬行:1,傾聽:1}},{label:'先停止交易，再與同窗討論界線',stats:{義:1,禮:1},skills:{克制:1,觀照:1}}]}],ends:[{flag:'jade_honest',text:'你說明玉佩屬於同窗，攤主收回提議。主人感謝你沒有替他作主，也沒有隱瞞利益。',summary:'你守住所有權與信任。',quote:'《論語·為政》：「人而無信，不知其可也。」',reward:{信:2,義:1},bond:{子貢:1},skills:{躬行:2}},{flag:'jade_terms',text:'交易條件被完整寫下，玉佩主人與同門共同判斷。攤主雖失望，仍承認你的處理公平。',summary:'你把模糊邀約帶回透明程序。',quote:'反思：資訊不對稱時，誰應該先揭露？',reward:{智:2,信:1},skills:{明理:2}},{flag:'jade_public',text:'你請無利害關係者協助估價，也公開自己與玉佩主人的關係，避免私利影響判斷。',summary:'你主動揭露利益關係。',quote:'《論語·里仁》：「見利思義。」',reward:{義:1,信:2},skills:{求助:1,躬行:1}},{flag:'jade_source',text:'查明玉佩來歷後，你發現攤主的說法有誤。你與同窗一起拒絕交易，並提醒其他人留意。',summary:'你先查證，再作出誠信選擇。',quote:'《論語·子張》：「君子愛人以德。」',reward:{智:2,義:1},skills:{明理:2}},{flag:'jade_boundary',text:'你暫停交易，說明未經主人同意不會處分物品。這條界線讓後續對話清楚許多。',summary:'你為自己與同窗設定清楚界線。',quote:'反思：面對利益誘惑，哪一條原則必須先說清楚？',reward:{義:2,禮:1},skills:{克制:1,觀照:1}},{flag:'jade_owner',text:'主人得知完整經過後自行選擇保留玉佩，並感謝你讓他掌握決策資訊。',summary:'你把選擇權交還給物品主人。',quote:'《論語·顏淵》：「己所不欲，勿施於人。」',reward:{信:2,仁:1},skills:{傾聽:1,躬行:1}}]}),
 apology:makeArc({title:'未寄出的道歉',place:'書舍 · 燈下',scene:'rain',summary:'道歉要承認影響，也要用行動修復。',art:7,openWho:'曾子',open:s=>`你想起曾在同門面前說過一句傷人的話。${s.flags.jade_honest?'最近你已在利益衝突中選擇坦白。':'你仍不確定坦白會不會讓事情更難收拾。'}道歉的竹簡寫了又刪，始終沒有送出。`,first:[{label:'先寫清楚自己做了什麼、造成什麼影響',stats:{信:1,仁:2},skills:{觀照:2}},{label:'找可信任的同門討論如何道歉',stats:{禮:1,智:1},skills:{求助:1,傾聽:1}},{label:'直接去找對方，先聽他怎麼看',stats:{勇:1,仁:1},skills:{躬行:1,傾聽:1}}],branches:[{who:'顏回',text:'顏回提醒：若只想讓自己不再內疚，對方可能又要承擔一次你的情緒。',choices:[{label:'先詢問對方是否願意談，尊重他的時間',stats:{禮:2,仁:1},skills:{傾聽:2}},{label:'清楚說明自己的行為與造成的傷害',stats:{信:2,義:1},skills:{躬行:1,觀照:1}}]},{who:'子路',text:'子路說：「認錯要有膽量，但不能要求人家立刻原諒。」',choices:[{label:'道歉後提出可執行的補救，接受對方決定',stats:{信:2,勇:1},skills:{躬行:2}},{label:'先問對方希望怎麼修復，再一起討論',stats:{仁:2,禮:1},skills:{傾聽:1,求助:1}}]},{who:'曾子',text:'曾子看見你又在竹簡上寫「如果讓你不舒服」，提醒你不要把責任推回對方感受。',choices:[{label:'刪去推託語句，直接承認自己的選擇',stats:{義:2,信:1},skills:{觀照:1,躬行:1}},{label:'承認自己害怕，也不拿害怕當藉口',stats:{勇:1,信:1},skills:{觀照:1,克制:1}}]}],ends:[{flag:'apology_listen',text:'對方願意談，你先完整聽完他的感受，再承認自己的言行。你沒有要求他當場原諒。',summary:'你先聽見傷害，再表達歉意。',quote:'《論語·學而》：「過則勿憚改。」',reward:{仁:2,禮:1},bond:{顏回:1},skills:{傾聽:2}},{flag:'apology_repair',text:'你提出具體補救並接受對方暫時不回應。道歉沒有立即消除傷口，卻讓修復開始有了方向。',summary:'你把道歉落實為可驗證的補救。',quote:'反思：哪些行動能讓道歉不只停在語言？',reward:{信:2,義:1},skills:{躬行:2}},{flag:'apology_ask',text:'對方說明自己需要的是你停止在眾人面前開玩笑。你們約定先從這件事開始調整。',summary:'你讓對方參與決定修復方式。',quote:'《論語·顏淵》：「己所不欲，勿施於人。」',reward:{仁:2,禮:1},skills:{傾聽:1,求助:1}},{flag:'apology_direct',text:'你收回推託語句，承認是自己的選擇傷害了對方。對方仍需要時間，但知道你願意負責。',summary:'你不再用模糊措辭逃避責任。',quote:'《論語·子張》：「過而不改，是謂過矣。」',reward:{義:2,信:1},skills:{躬行:1,觀照:1}},{flag:'apology_fear',text:'你坦白自己害怕失去關係，卻不以恐懼要求對方安慰。這是一次不完美但真實的開始。',summary:'你承認害怕，也承擔行動後果。',quote:'反思：道歉是在尋求寬恕，還是在承擔責任？',reward:{勇:1,信:2},skills:{觀照:1,克制:1}},{flag:'apology_wait',text:'對方現在不想談。你留下簡短而清楚的歉意，承諾不再打擾，並以後續行動證明改變。',summary:'你尊重對方暫時不接受對話的界線。',quote:'《論語·衛靈公》：「己所不欲，勿施於人。」',reward:{信:1,禮:1},skills:{克制:1,躬行:1}}]}),
 burden:makeArc({title:'一人挑不動的擔子',place:'鄉間 · 運糧路',scene:'grain',summary:'求助不是卸責；分工與界線讓承擔可以持續。',art:8,openWho:'冉有',open:s=>`鄉里要把糧食送到受災人家，你已連續幫忙多日，肩膀疼痛卻不敢停下。${s.flags.apology_repair?'你最近練習以實際行動修復關係。':'你常覺得只要再努力一點就能全部完成。'}`,first:[{label:'先說明身體狀況，請大家一起重新分工',stats:{信:1,勇:1},skills:{求助:2}},{label:'把工作拆成路線與時段，邀人認領',stats:{智:2,禮:1},skills:{明理:1,躬行:1}},{label:'拒絕再多接一項，保留休息時間',stats:{義:1,信:1},skills:{克制:1,觀照:1}}],branches:[{who:'冉有',text:'冉有盤點後發現，有幾個人不知道你已經接下太多工作。',choices:[{label:'公開工作清單，讓需求與人力對得上',stats:{智:2,信:1},skills:{明理:1,躬行:1}},{label:'直接請兩位同伴各接一段，說明原因',stats:{勇:1,禮:1},skills:{求助:1,傾聽:1}}]},{who:'子路',text:'子路想把所有工作一次扛起來，卻也已經很疲累。',choices:[{label:'一起商量每個人能承擔的上限',stats:{仁:1,禮:1},skills:{傾聽:1,觀照:1}},{label:'請子路先休息，你接手最急的一段',stats:{仁:1,勇:1},skills:{克制:1,躬行:1}}]},{who:'孔子',text:'夫子問：若大家只靠一個人不斷犧牲，這件善事還能持續多久？',choices:[{label:'建立輪替、回報與休息規則',stats:{智:1,信:2},skills:{明理:1,躬行:1}},{label:'說清楚自己能做到的範圍，也邀請更多人',stats:{義:1,仁:1},skills:{求助:1,克制:1}}]}],ends:[{flag:'burden_shared',text:'工作重新分配後，糧食如期送到。你休息了一段時間，下一次仍能與大家同行。',summary:'你把求助化為共同承擔。',quote:'《論語·顏淵》：「己欲立而立人，己欲達而達人。」',reward:{仁:1,信:1},bond:{冉有:1},skills:{求助:2}},{flag:'burden_plan',text:'公開工作清單後，人力缺口一目了然。有人願意補位，大家也找到更省力的路線。',summary:'你讓問題可見，讓分工有依據。',quote:'《論語·為政》：「舉直錯諸枉，則民服。」',reward:{智:2,信:1},skills:{明理:1,躬行:1}},{flag:'burden_limit',text:'你說明自己的承擔上限，其他人接下新的任務。你發現界線沒有讓善意消失，反而讓合作更穩定。',summary:'你設下界線，讓善意可以持續。',quote:'反思：我能承擔什麼？又需要誰一起承擔？',reward:{義:1,信:1},skills:{克制:1,觀照:1}},{flag:'burden_buddy',text:'你與子路把工作分成可完成的小段，也約定彼此提醒休息。',summary:'你讓夥伴關係包含相互照顧。',quote:'《論語·學而》：「有朋自遠方來，不亦樂乎。」',reward:{仁:1,禮:1},bond:{子路:1},skills:{傾聽:1,求助:1}},{flag:'burden_pause',text:'你們先讓最疲累的人休息，再安排接手。短暫停下沒有耽誤整體，反而避免更多人受傷。',summary:'你看見休息也是責任的一部分。',quote:'反思：什麼時候停下，是對共同目標更負責？',reward:{仁:1,勇:1},skills:{克制:1,躬行:1}},{flag:'burden_system',text:'大家建立輪替表與回報方式，工作不再依賴一人默默補位。',summary:'你為善行建立可以接續的機制。',quote:'《論語·子路》：「先之，勞之。」',reward:{信:2,智:1},skills:{明理:1,躬行:1}}]}),
 forum:makeArc({title:'杏壇風波',place:'杏壇 · 眾議堂',scene:'market',summary:'整合明理、觀照與躬行，處理群體衝突。',art:9,openWho:'孔子',open:s=>`杏壇流傳一則未經查證的消息，指稱有人挪用了共學資源。幾個小組開始互相指責，活動也面臨中止。${s.flags.market_truth?'你曾在市集事件中先查證再介入。':''}${s.flags.debate_common?'你也曾把辯論帶回共同求證。':''}現在需要你協助眾人處理這場風波。`,first:[{label:'先暫停指責，保全紀錄並查明訊息來源',stats:{智:2,義:1},skills:{明理:2,克制:1}},{label:'先聽取受影響者的感受與實際需求',stats:{仁:2,禮:1},skills:{觀照:1,傾聽:1}},{label:'召集代表協商，訂下暫行處理原則',stats:{信:1,勇:1},skills:{躬行:1,求助:1}}],branches:[{who:'子貢',text:s=>`${s.flags.jade_honest?'你在玉佩事件中曾主動公開利益關係。':'子貢提醒，資訊不透明會讓猜測變成指控。'}這次帳冊有一頁缺失，卻沒有人知道它何時不見。`,choices:[{label:'保存現有資料，列出可查證與未知部分',stats:{智:2,信:1},skills:{明理:2}},{label:'請不同小組共同核對帳目，避免單方定案',stats:{禮:1,智:1},skills:{求助:1,明理:1}}]},{who:'顏回',text:'被指責的同門不願再出席。受影響者也擔心問題被淡化。',choices:[{label:'分別聽取雙方需求，安排安全的對話',stats:{仁:2,禮:1},skills:{傾聽:2,觀照:1}},{label:'先提出暫行支持措施，再繼續查證',stats:{義:1,信:1},skills:{躬行:1,克制:1}}]},{who:'曾子',text:'曾子指出，即使查明真相，群體仍需要面對流程缺口與信任受損。',choices:[{label:'同步公開調查進度與責任分工',stats:{信:2,智:1},skills:{躬行:1,明理:1}},{label:'安排事後檢討與修復，避免只找一個人負責',stats:{仁:1,義:1},skills:{觀照:1,躬行:1}}]}],ends:[{flag:'forum_evidence',text:'你們保存紀錄並逐項查證，發現訊息有一部分正確、另一部分是誤解。群體先停止傳播，再按證據處理。',summary:'你以明理止住未查證的指控。',quote:'《論語·為政》：「知之為知之，不知為不知，是知也。」',reward:{智:2,義:1},skills:{明理:2,克制:1}},{flag:'forum_joint',text:'不同小組共同核帳，沒有人可以單方面決定結論。雖然花了更多時間，大家願意接受過程。',summary:'你用共同查證重建程序信任。',quote:'《論語·顏淵》：「君子成人之美，不成人之惡。」',reward:{信:2,禮:1},skills:{求助:1,明理:1}},{flag:'forum_listen',text:'你安排安全對話，先讓被指責者與受影響者都能完整說明。群體同意暫緩定罪並提供支持。',summary:'你讓受傷者被聽見，也避免未審先判。',quote:'《論語·衛靈公》：「己所不欲，勿施於人。」',reward:{仁:2,禮:1},skills:{傾聽:2,觀照:1}},{flag:'forum_support',text:'你們先處理眼前受影響者的支持需求，同時保留查證空間，沒把照顧與求真對立起來。',summary:'你兼顧實際支持與事實查明。',quote:'反思：不確定時，哪些支持措施仍然做得到？',reward:{義:1,信:1},skills:{躬行:1,克制:1}},{flag:'forum_open',text:'調查進度與責任分工公開後，傳言逐漸停止。大家開始討論如何補足原本的管理缺口。',summary:'你用透明行動修復群體信任。',quote:'《論語·顏淵》：「民無信不立。」',reward:{信:2,智:1},skills:{躬行:1,明理:1}},{flag:'forum_repair',text:'事件後檢討沒有只追究個人，也調整資源管理與申訴流程。杏壇重新開放，群體知道修復仍要持續。',summary:'你把衝突轉成共同學習與制度改善。',quote:'《論語·學而》：「 function realmIndex(st=s){const done=id=>st.done.includes(id),skill=k=>st.skills?.[k]||0,stat=k=>st.stats?.[k]||0;let r=st.legacyRealm||0;if(done('market')&&(st.cultivation>=3)&&(stat('禮')>=10||skill('傾聽')>=1))r=Math.max(r,1);if(done('promise')&&st.cultivation>=8&&(stat('義')>=12||skill('明理')>=2))r=Math.max(r,2);if(done('rain')&&st.cultivation>=14&&(stat('信')>=14||skill('躬行')>=2))r=Math.max(r,3);if(done('grain')&&st.cultivation>=20&&(stat('仁')>=15||skill('觀照')>=2))r=Math.max(r,4);if(done('empty_seat')&&st.cultivation>=30&&skill('克制')>=2&&bondTotal()>=2)r=Math.max(r,5);if(done('apology')&&st.cultivation>=40&&Object.values(st.skills||{}).reduce((a,b)=>a+b,0)>=10&&bondTotal()>=4)r=Math.max(r,6);return Math.min(6,r);}
function realmRequirements(next=realmIndex(s)+1){const r=realmNames[next]||'已達最高境界';const hints={1:'完成第 1 幕、修為 3，並讓禮或傾聽有所成長',2:'完成第 2 幕、修為 8，並提升義或明理',3:'完成第 3 幕、修為 14，並提升信或躬行',4:'完成第 4 幕、修為 20，並提升仁或觀照',5:'完成第 6 幕、修為 30、克制技能 2、羈絆合計 2',6:'完成第 8 幕、修為 40、技能合計 10、羈絆合計 4'};return `${r}：${hints[next]||'已達最高境界'}`;}

function unmet(id){if(!story[id])return '';if(id==='market')return '初始關卡';if(mainGates[id]){const ix=mainIndex(id),parts=[];if(ix>0&&!s.done.includes(mainOrder[ix-1]))parts.push(`完成上一幕「${mainNames[ix-1]}」`);const need={promise:1,rain:2,grain:3,debate:4,jade:5,burden:6}[id];if(need&&realmIndex(s)<need)parts.push(realmRequirements(need));return parts.length?'尚缺：'+parts.join('；'):'可進入';}const m=mindConfigs.find(x=>x.id===id);return m?`尚缺：${m.unlock}`:'尚未解鎖';}

function updateSkill(k,v){if(!k)return;s.skills[k]=Math.max(0,Math.min(99,(s.skills[k]||0)+v));}
function gain(stats={},bonds={},skills={}){for(const[k,v]of Object.entries(stats))s.stats[k]=Math.max(0,Math.min(100,(s.stats[k]||0)+v));for(const[k,v]of Object.entries(bonds))s.bonds[k]=Math.max(-10,Math.min(10,(s.bonds[k]||0)+v));for(const[k,v]of Object.entries(skills))updateSkill(k,v);s.cultivation=(s.cultivation||0)+Math.max(0,Math.ceil(Object.values(stats).reduce((a,b)=>a+b,0)/2));}

function statsHtml(){return `<div class="stats">${Object.entries(s.stats||{}).map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`;}
function skillHtml(){return `<div class="skill-grid">${skillsList.map(k=>`<div class="skill-card"><span>${k}</span><b>${s.skills[k]||0}</b><div class="bar"><span style="width:${Math.min(100,(s.skills[k]||0)*10)}%"></span></div></div>`).join('')}</div>`;}
function progressCard(){return `<section class="card realm-card"><div><small class="muted">目前境界</small><h2>✦ ${realmNames[realmIndex()]}</h2><p>修為 ${s.cultivation||0}｜第 ${s.day} 日（不作劇情門檻）</p></div><div class="realm-next">${realmIndex()<6?`下一境界<br><b>${realmRequirements(realmIndex()+1)}</b>`:'已達弘道境界'}</div></section>`;}
function header(){return `<header><strong>✦ 孔門養成記｜十幕修行</strong><div class="flex"><span class="tiny muted">${s.role?`${esc(s.nick||roles[s.role].name)} · ${realmNames[realmIndex()]}`:'風雨杏壇'}</span></div></header>`;}
function storyCard(id,index,section){const e=story[id],done=s.done.includes(id),open=storyUnlocked(id),routes=(s.routeBook[id]||[]).length,number=section==='main'?`第 ${index+1} 幕`:`副本 ${index+1}`;return `<article class="mission-card ${open?'':'locked'}"><div class="mission-top"><div><small class="muted">${number}</small><h3>${esc(e.title)}</h3></div>${e.kind==='mind'?mindSprite(e.art||0):''}</div><p>${esc(e.summary||e.subtitle||'故事分支會依你的選擇展開。')}</p><div class="mission-foot"><span class="tiny muted">${done?`已完成 · 已探索 ${routes} 種結局`:open?'已解鎖':esc(unmet(id))}</span>${open?`<button class="btn ${done?'':'primary'}" data-act="launch" data-id="${id}">${done?'重玩':'開始歷練'}</button>`:`<button class="btn" disabled>尚未解鎖</button>`}</div></article>`;}
function mainList(){return `<div class="card"><h2>十幕主線</h2><p class="muted">依境界與前置故事推進，沒有週數限制。未解鎖時會列出尚缺條件。</p><div class="mission-grid">${mainOrder.map((id,i)=>storyCard(id,i,'main')).join('')}</div></div>`;}
function mindList(){return `<div class="card"><h2>十種心魔副本</h2><p class="muted">每個副本都走過「觸發情境 → 心中拉扯 → 實際回應」。練成克制後，可以在拉扯階段直接運用技能快速回應。</p><div class="mission-grid">${mindOrder.map((id,i)=>storyCard(id,i,'mind')).join('')}</div></div>`;}
function activityPanel(){const choices=[['觀照','看見情緒與身體訊號'],['明理','分辨事實、推測與價值判斷'],['躬行','把想法化成一小步行動'],['克制','停一拍再作選擇'],['傾聽','練習完整聽見對方'],['求助','清楚提出具體協助']];return `<div class="card"><h2>自由修習</h2><p class="muted">修習是額外養成，不會要求等待幾週才能進入故事。每一技能每天可修習一次，或直接繼續已開放的篇章。</p><div class="practice-grid">${choices.map(([k,d])=>`<button class="practice-btn" data-act="practice" data-id="${k}" ${(s.practiceUsed||[]).includes(k)?'disabled':''}><b>${k}　${s.skills[k]||0}</b><small>${d}${(s.practiceUsed||[]).includes(k)?' · 今日已修習':''}</small></button>`).join('')}</div><div class="flex" style="margin-top:12px">${btn('迎接新的一日（重置修習）','next','', 'gold')}${btn('檢視修為與技能','go','skills')}</div></div>`;}
function homeView(){const mainDone=mainOrder.filter(id=>s.done.includes(id)).length,mindDone=mindOrder.filter(id=>s.done.includes(id)).length;return `${scene('杏壇風雲','魯國 · 曲阜')}<div class="welcome-art"></div>${progressCard()}<div class="card"><div class="flex between"><div><h2>${esc(s.nick||roles[s.role].name)} · ${roles[s.role].title}</h2><span class="muted">主線 ${mainDone}/10｜心魔 ${mindDone}/10｜修為 ${s.cultivation||0}</span></div><span class="chip">自由遊歷 · 無週數鎖定</span></div>${statsHtml()}<h3 style="margin-top:16px">六項修習技能</h3>${skillHtml()}</div><div class="grid"><div class="card"><h2>繼續歷練</h2><p class="muted">${mainDone<10?`下一幕：${mainNames[mainDone]||'杏壇風波'}`:'十幕主線已完成，仍可重玩探索不同結局。'}</p>${btn(mainDone<10?'查看主線與解鎖條件':'重玩已完成篇章','go','main','primary')}</div><div class="card"><h2>探索心境</h2><p class="muted">目前 ${mindDone}/10 種心魔已突破；已解鎖副本可隨時重玩。</p>${btn('進入心魔副本','go','mind','primary')}</div></div>${activityPanel()}<div class="grid"><section class="card"><h2>同門近況</h2>${Object.entries(s.bonds).map(([p,v])=>`<div class="bond-row"><span>${p}</span><span class="tiny muted">羈絆 ${v}</span></div>`).join('')}${btn('查看同門羈絆','go','bond')}</section><section class="card"><h2>情境歷練冊</h2><p class="muted">已完成事件可以重新體驗，收集不同路線與結局，不會重複刷取能力值。</p>${btn('開啟歷練冊','go','book')}</section></div>`;}
function bookView(){return `<div class="card"><h2>情境歷練冊</h2><p class="muted">重玩已完成事件可探索不同路線、對話與結局。重玩不會重複增加能力或修為。</p><div class="book-tabs"><button class="btn ${s.bookTab!=='mind'?'primary':''}" data-act="booktab" data-id="main">主線與情境</button><button class="btn ${s.bookTab==='mind'?'primary':''}" data-act="booktab" data-id="mind">心魔副本</button></div>${s.bookTab==='mind'?mindList():mainList()}</div>`;}
function choiceHtml(c,i){const req=c[5],ready=!req||(s.skills[req.skill]||0)>=req.min;return `<button class="choice" data-act="choose" data-id="${i}" ${ready?'':'disabled'}>${esc(c[0])}${c[4]&&Object.keys(c[4]).length?`<small>技能成長：${Object.entries(c[4]).map(([k,v])=>`${k} +${v}`).join('、')}</small>`:''}${req?`<small>${ready?`技能加速已啟用：${req.skill}`:`尚需${req.skill}技能 ${req.min}（目前 ${s.skills[req.skill]||0}）`}</small>`:(s.playMode==='replay'?'<small>探索其他分支與結局；重玩不增加能力值</small>':'<small>選擇會影響修為、技能、羈絆與後續對話</small>')}</button>`;}
function storyView(){const e=story[s.current],n=e?.nodes?.[s.node];if(!e||!n)return `<div class="card">劇情資料無法讀取。${btn('返回杏壇','go','home')}</div>`;const replay=s.playMode==='replay';return `${scene(e.title,e.place,e.scene)}${sceneArt(e)}<div class="card"><div class="flex between"><span class="chip">${esc(e.title)}${replay?' · 重玩探索':''}</span><span class="tiny muted">${esc(e.source||'')}</span></div>${replay?'<div class="note" style="margin-top:10px">重玩模式：可探索不同分支，但不會重複獲得能力或修為。</div>':''}<div class="divider"></div><div class="dialog">${portrait(safeText(n.who))}<div class="speech"><div class="name">${esc(safeText(n.who))}</div><div class="storyText">${esc(safeText(n.text))}</div></div></div>${n.end?`<div class="note" style="margin-top:14px"><b>${esc(n.summary)}</b><p class="tiny">${esc(n.quote||'')}</p></div><div class="flex" style="margin-top:12px">${btn(replay?'記錄探索結果，返回歷練冊':'記錄本次歷練，返回杏壇','finish','','gold')}</div>`:`<div class="choices">${n.choices.map(choiceHtml).join('')}</div>`}</div>`;}
function journalView(){return `<div class="card"><h2>修身錄</h2><p class="muted">首通、技能成長與不同結局都會留下紀錄。</p><div class="log">${s.journal.length?s.journal.map(x=>`<p>${esc(x)}</p>`).join(''):'尚無紀錄。先完成一段歷練。'}</div>${btn('返回杏壇','go','home')}</div>`;}
function bondView(){return `<div class="card"><h2>同門羈絆</h2>${Object.entries(s.bonds).map(([k,v])=>`<div class="relationship-row">${portrait(k,true)}<div class="relationship-main"><div class="flex between"><b>${k}</b><span class="muted">${v>0?'+':''}${v}｜${v>=5?'深厚信任':v>=2?'漸有默契':v<=-2?'有所隔閡':'初識'}</span></div><div class="bar"><span style="width:${Math.max(4,Math.min(100,50+v*7))}%"></span></div></div></div>`).join('')}<div class="divider"></div><h3>拜訪與交流</h3><div class="grid three">${Object.keys(s.bonds).map(p=>`<button class="btn" data-act="speak" data-id="${p}">${p} · 交流</button>`).join('')}</div>${s.talking?`<div class="dialog" style="margin-top:12px">${portrait(s.talking)}<div class="speech"><div class="name">${s.talking}</div>${s.talking==='孔子'?'學而不思則罔，思而不學則殆。你今日想從何處用功？':s.talking==='子路'?'勇氣若能與明理同行，行動便更能利益他人。':s.talking==='子貢'?'一項決策除了眼前利益，也要看長期信任與公平。':s.talking==='顏回'?'安住內心，也別忘了把所學化成照顧他人的行動。':s.talking==='曾子'?'吾日三省吾身。你今日最想檢視哪一個選擇？':'做事要看資源、時程與每個人的承擔能力。'}<div style="margin-top:10px">${(s.talked||[]).includes(s.talking)?'<span class="tiny muted">本輪交流已記錄；羈絆仍會在共同歷練中成長。</span>':btn('交流一段經歷（羈絆 +1）','befriend','','primary')}</div></div></div>`:''}${btn('返回杏壇','go','home')}</div>`;}
function settingsView(){return `<div class="card"><h2>存檔與進度</h2><p>遊戲會自動儲存在此瀏覽器。V3 的四幕進度會自動接續到新版本；建議仍匯出一份 JSON 備份。</p><div class="flex">${btn('下載 JSON 備份','export','','gold')}<label class="btn">匯入 JSON 備份<input id="import" type="file" accept="application/json,.json" style="display:none"></label>${btn('重新開始','reset')}</div><p class="tiny muted">匯入會覆蓋目前進度。請勿刪除原本的瀏覽器存檔，除非已完成備份。</p>${btn('返回杏壇','go','home')}</div>`;}
function render(){refreshUnlocks();let h=header();if(s.screen!=='create')h+=nav();h+='<main>';if(s.screen==='create')h+=`${scene('杏壇初遇','魯國 · 曲阜')}<div class="create-art"></div><div class="card intro"><h1>在故事裡，練習成為更好的自己</h1><p class="muted">選擇孔門弟子身份，完成十幕主線、十種心魔修習與可重玩的情境。故事按境界與技能逐步解鎖，不需要等週數。</p><div class="grid three">${Object.entries(roles).map(([id,r])=>`<button class="btn role-btn" data-act="pick" data-id="${id}" style="border-color:${draftRole===id?'#f5d18b':'#ffffff33'}">${portrait(r.name)}<b>${r.name}</b><div class="tiny muted">${r.title}</div></button>`).join('')}</div><div class="divider"></div><h3>${roles[draftRole].name} · ${roles[draftRole].title}</h3><p>${roles[draftRole].desc}</p><label class="tiny muted" for="nick">遊戲稱呼（可留空）</label><input id="nick" maxlength="12" placeholder="輸入稱呼" value="${esc(draftNick)}"><div style="margin-top:14px">${btn('踏入杏壇，開始故事','start','','primary')}</div></div>`;else if(!s.role)h+=`<div class="card">尚未選擇角色。${btn('建立角色','go','create')}</div>`;else if(s.screen==='home')h+=homeView();else if(s.screen==='main')h+=mainList();else if(s.screen==='mind')h+=mindList();else if(s.screen==='book')h+=bookView();else if(s.screen==='story')h+=storyView();else if(s.screen==='journal')h+=journalView();else if(s.screen==='bond')h+=bondView();else if(s.screen==='settings')h+=settingsView();else if(s.screen==='skills')h+=`<div class="card"><h2>修為與技能</h2>${progressCard()}${statsHtml()}${skillHtml()}${activityPanel()}</div>`;h+='</main>';el.innerHTML=h;const inp=document.getElementById('nick');if(inp)inp.addEventListener('input',e=>draftNick=e.target.value);document.getElementById('import')?.addEventListener('change',importFile);}
function go(screen){s.screen=screen;save();render();window.scrollTo(0,0)}function addLog(t){s.journal.unshift(`第 ${s.day} 日｜${t}`);s.journal=s.journal.slice(0,200);}
function choose(i){const n=story[s.current]?.nodes?.[s.node],c=n?.choices?.[i];if(!c)return;if(c[5]&&(s.skills[c[5].skill]||0)<c[5].min)return;s.pendingChoices=s.pendingChoices||[];s.pendingChoices.push(`${story[s.current].title}：${c[0]}`);if(s.playMode!=='replay')gain(c[2],c[3],c[4]);s.node=c[1];save();render();}
function finish(){const e=story[s.current],n=e?.nodes?.[s.node];if(!n?.end)return;const id=s.current,route=n.flag;const routes=s.routeBook[id]||[];if(!routes.includes(route)){routes.push(route);s.routeBook[id]=routes;}if(s.playMode!=='replay'&&!s.done.includes(id)){gain(n.reward,n.bond,n.skillReward);s.cultivation=(s.cultivation||0)+(n.cultivation||5);s.done.push(id);s.unlocked[id]=true;s.flags[route]=true;addLog(`${e.title}首通：${n.summary}`);toast('首次突破完成，修為與技能已記錄');}else{addLog(`${e.title}探索新路線：${n.summary}`);toast(routes.length>1?'發現不同的故事結果':'已記錄這次探索；重玩不增加能力');}s.current=null;s.node=null;s.pendingChoices=[];s.screen=s.playMode==='replay'?'book':'home';s.playMode='first';save();render();}
function practice(k){if(!skillsList.includes(k)||(s.practiceUsed||[]).includes(k))return;s.practiceUsed.push(k);updateSkill(k,1);s.cultivation=(s.cultivation||0)+1;addLog(`自由修習「${k}」：技能 +1，修為 +1`);save();render();toast(`${k} +1｜修為 +1`);}
function exportFile(){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='孔門養成記_十幕修行_存檔.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function importFile(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.role||!roles[x.role]||!Array.isArray(x.done))throw Error();if(!confirm('確定用備份覆蓋目前進度？'))return;s=migrate(x);save();render();toast('存檔匯入完成')}catch(err){alert('存檔格式無效，未匯入。')}};r.readAsText(f);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;switch(act){case'pick':draftRole=id;render();break;case'start':s=fresh();s.role=draftRole;s.nick=(draftNick||roles[draftRole].name).trim().slice(0,12)||roles[draftRole].name;s.stats={...roles[draftRole].stats};s.cultivation=0;addLog(`以${roles[draftRole].name}的身分踏入杏壇`);go('home');break;case'go':go(id);break;case'launch':if(!storyUnlocked(id))return;s.current=id;s.node=story[id].start;s.playMode=s.done.includes(id)?'replay':'first';s.pendingChoices=[];go('story');break;case'choose':choose(Number(id));break;case'finish':finish();break;case'next':s.day++;s.practiceDay=s.day;s.practiceUsed=[];addLog('迎接新的一日：自由修習次數已重置');save();render();toast('修習次數已重置，故事仍可隨時進入');break;case'practice':practice(id);break;case'journal':go('journal');break;case'booktab':s.bookTab=id;save();render();break;case'speak':s.talking=id;save();render();break;case'befriend':if((s.talked||[]).includes(s.talking))return;s.talked.push(s.talking);s.bonds[s.talking]=Math.min(10,(s.bonds[s.talking]||0)+1);addLog(`與${s.talking}交流，羈絆 +1`);save();render();toast('同門羈絆 +1');break;case'export':exportFile();break;case'reset':if(confirm('確定清除目前存檔並重新開始？此動作無法復原，建議先匯出備份。')){s=fresh();draftNick='';save();render()}break;}});
render();

</script></body></html>
